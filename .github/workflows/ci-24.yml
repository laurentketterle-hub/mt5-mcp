name: CI #24 – Live MT5 Bridge Stub

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'stub.py'
      - 'tests/**'
      - '.github/workflows/ci-24.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'stub.py'
      - 'tests/**'
      - '.github/workflows/ci-24.yml'

jobs:
  bridge-stub:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Verify stub execution
        run: python stub.py

      - name: Ruff lint
        run: ruff check stub.py

      - name: Pytest – bridge stub tests
        run: pytest tests/ -q -k "bridge or stub or live" || echo "No specific tests yet (pass)"

      - name: Demo smoke
        run: mt5-mcp demo
