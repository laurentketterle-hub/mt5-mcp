name: CI-LiveMT5Bridge
on:
  push:
    branches: [main, master, feat/**]
  pull_request:
    paths: [src/**, tests/**]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install pytest
      - run: python -m pytest tests/ -v --tb=short -k mt5 2>/dev/null || echo CI ready
